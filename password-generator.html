<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passphrase Forge</title>
<style>
  :root{
    --bg-deep:#050a1f;
    --bg-mid:#0c1638;
    --panel:rgba(15,23,55,0.65);
    --line:#2a355f;
    --text:#eaf0ff;
    --muted:#7c86ad;
    --accent:#6ee7ff;
    --accent2:#8b7bff;
    --weak:#ff6b6b;
    --mid:#ffd166;
    --strong:#6effa8;
    font-family:"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, var(--bg-mid), var(--bg-deep) 70%);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:56px 20px;
    position:relative;
    overflow-x:hidden;
  }
  canvas#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .card{
    width:100%;
    max-width:460px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px;
    position:relative;
    z-index:1;
    backdrop-filter:blur(10px);
    box-shadow:0 0 60px rgba(139,123,255,0.08), 0 20px 50px rgba(0,0,0,0.4);
    animation:riseIn 0.5s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:0.85rem;
    margin:0 0 28px;
  }
  .output{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(5,10,30,0.7);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
    transition:box-shadow 0.3s;
  }
  .output.pulse{
    box-shadow:0 0 0 3px rgba(110,231,255,0.25);
  }
  #pwOutput{
    flex:1;
    font-family:"SFMono-Regular", Consolas, "Courier New", monospace;
    font-size:1.15rem;
    letter-spacing:0.02em;
    word-break:break-all;
    color:var(--accent);
    transition:opacity 0.15s;
  }
  .icon-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:9px;
    width:38px;
    height:38px;
    flex:0 0 auto;
    cursor:pointer;
    font-size:1rem;
    transition:0.15s;
  }
  .icon-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .icon-btn:active{ transform:scale(0.9); }
  #refreshBtn.spin{ animation:spin 0.4s ease; }
  @keyframes spin{ to{ transform:rotate(180deg); } }

  .strength{
    height:6px;
    border-radius:4px;
    background:var(--line);
    overflow:hidden;
    margin-bottom:6px;
  }
  .strength-fill{
    height:100%;
    width:0%;
    transition:width 0.3s ease, background 0.3s ease;
    box-shadow:0 0 10px currentColor;
  }
  .strength-label{
    font-size:0.78rem;
    color:var(--muted);
    margin-bottom:28px;
    display:block;
  }

  .field{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .field label{ font-size:0.9rem; }
  .field span.val{
    font-family:monospace;
    color:var(--accent);
  }
  input[type=range]{
    width:100%;
    accent-color:var(--accent);
    margin-top:8px;
  }
  .toggles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0 28px;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(5,10,30,0.7);
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 12px;
    font-size:0.85rem;
    cursor:pointer;
    user-select:none;
    transition:border-color 0.15s;
  }
  .toggle:hover{ border-color:var(--accent2); }
  .toggle input{ accent-color:var(--accent); }

  .generate{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#050a1f;
    font-weight:700;
    font-size:0.95rem;
    border:none;
    border-radius:12px;
    cursor:pointer;
    letter-spacing:0.02em;
    transition:filter 0.15s, transform 0.1s;
  }
  .generate:hover{ filter:brightness(1.1); }
  .generate:active{ transform:scale(0.98); }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#050a1f;
    padding:10px 18px;
    border-radius:8px;
    font-size:0.85rem;
    font-weight:700;
    opacity:0;
    transition:0.2s;
    pointer-events:none;
    z-index:2;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .credit{
    text-align:center;
    margin-top:20px;
    font-size:0.72rem;
    letter-spacing:0.04em;
    color:var(--muted);
    font-family:monospace;
  }
  .credit span{ color:var(--accent); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="card">
  <h1>Passphrase Forge</h1>
  <p class="sub">Generate a strong, random password.</p>

  <div class="output" id="outputBox">
    <span id="pwOutput">••••••••••••</span>
    <button class="icon-btn" id="copyBtn" title="Copy">⧉</button>
    <button class="icon-btn" id="refreshBtn" title="Regenerate">↻</button>
  </div>
  <div class="strength"><div class="strength-fill" id="strengthFill"></div></div>
  <span class="strength-label" id="strengthLabel">Generate a password to see its strength</span>

  <div class="field">
    <label for="lengthRange">Length</label>
    <span class="val" id="lengthVal">16</span>
  </div>
  <input type="range" id="lengthRange" min="6" max="48" value="16">

  <div class="toggles">
    <label class="toggle"><input type="checkbox" id="optUpper" checked> Uppercase (A–Z)</label>
    <label class="toggle"><input type="checkbox" id="optLower" checked> Lowercase (a–z)</label>
    <label class="toggle"><input type="checkbox" id="optNumbers" checked> Numbers (0–9)</label>
    <label class="toggle"><input type="checkbox" id="optSymbols" checked> Symbols (!@#$)</label>
  </div>

  <button class="generate" id="generateBtn">Generate password</button>
  <div class="credit">Built by <span>BNMPC IT Club</span></div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
  // Starfield background
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 6000);
    for(let i = 0; i < STAR_COUNT; i++){
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.06,
        driftY: Math.random() * 0.08 + 0.02
      });
    }

    function tick(){
      ctx.clearRect(0, 0, w, h);
      for(const s of stars){
        s.phase += s.twinkleSpeed;
        s.x += s.driftX;
        s.y += s.driftY;
        if(s.y > h) { s.y = -2; s.x = Math.random() * w; }
        if(s.x > w) s.x = 0;
        if(s.x < 0) s.x = w;

        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,225,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  const SETS = {
    upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
    lower: 'abcdefghijkmnpqrstuvwxyz',
    numbers: '23456789',
    symbols: '!@#$%^&*()-_=+[]{}?'
  };

  const lengthRange = document.getElementById('lengthRange');
  const lengthVal = document.getElementById('lengthVal');
  const pwOutput = document.getElementById('pwOutput');
  const outputBox = document.getElementById('outputBox');
  const generateBtn = document.getElementById('generateBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const copyBtn = document.getElementById('copyBtn');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');
  const toast = document.getElementById('toast');

  const optUpper = document.getElementById('optUpper');
  const optLower = document.getElementById('optLower');
  const optNumbers = document.getElementById('optNumbers');
  const optSymbols = document.getElementById('optSymbols');
  const checkboxes = [optUpper, optLower, optNumbers, optSymbols];

  lengthRange.addEventListener('input', () => {
    lengthVal.textContent = lengthRange.value;
  });

  function secureRandomInt(max){
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function generatePassword(){
    const active = [];
    if(optUpper.checked) active.push(SETS.upper);
    if(optLower.checked) active.push(SETS.lower);
    if(optNumbers.checked) active.push(SETS.numbers);
    if(optSymbols.checked) active.push(SETS.symbols);

    if(active.length === 0){
      optLower.checked = true;
      active.push(SETS.lower);
    }

    const length = parseInt(lengthRange.value, 10);
    const allChars = active.join('');
    let result = [];

    active.forEach(set => {
      result.push(set[secureRandomInt(set.length)]);
    });

    while(result.length < length){
      result.push(allChars[secureRandomInt(allChars.length)]);
    }

    for(let i = result.length - 1; i > 0; i--){
      const j = secureRandomInt(i + 1);
      [result[i], result[j]] = [result[j], result[i]];
    }

    return result.slice(0, length).join('');
  }

  function scoreStrength(pw, setCount){
    let score = 0;
    if(pw.length >= 8) score++;
    if(pw.length >= 12) score++;
    if(pw.length >= 16) score++;
    score += setCount - 1;
    return Math.min(score, 6);
  }

  function updateStrength(pw){
    const setCount = checkboxes.filter(c => c.checked).length || 1;
    const score = scoreStrength(pw, setCount);
    const pct = Math.min((score / 6) * 100, 100);
    let color = 'var(--weak)', label = 'Weak';
    if(score >= 5){ color = 'var(--strong)'; label = 'Strong'; }
    else if(score >= 3){ color = 'var(--mid)'; label = 'Moderate'; }
    strengthFill.style.width = pct + '%';
    strengthFill.style.background = color;
    strengthFill.style.color = color;
    strengthLabel.textContent = `${label} · ${pw.length} characters`;
  }

  function runGenerate(){
    const pw = generatePassword();
    pwOutput.style.opacity = '0';
    setTimeout(() => {
      pwOutput.textContent = pw;
      pwOutput.style.opacity = '1';
      updateStrength(pw);
    }, 100);
    outputBox.classList.add('pulse');
    setTimeout(() => outputBox.classList.remove('pulse'), 400);
    refreshBtn.classList.add('spin');
    setTimeout(() => refreshBtn.classList.remove('spin'), 400);
  }

  generateBtn.addEventListener('click', runGenerate);
  refreshBtn.addEventListener('click', runGenerate);

  copyBtn.addEventListener('click', async () => {
    const text = pwOutput.textContent;
    if(!text || text.includes('•')) return;
    try{
      await navigator.clipboard.writeText(text);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    }
  });

  runGenerate();
</script>
</body>
</html>
