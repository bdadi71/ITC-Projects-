<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Well</title>
<style>
  :root{
    --bg-deep:#050a1f;
    --bg-mid:#0c1638;
    --ink:#eef2ff;
    --accent:#6ee7ff;
    --accent2:#8b7bff;
    --line:#2a355f;
    --muted:#7c86ad;
    font-family:"Iowan Old Style","Palatino Linotype", Georgia, serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, var(--bg-mid), var(--bg-deep) 70%);
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  canvas#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .stage{
    width:100%;
    max-width:640px;
    text-align:center;
    position:relative;
    z-index:1;
    animation:riseIn 0.6s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .mark{
    font-size:4rem;
    line-height:1;
    font-family:Georgia, serif;
    margin-bottom:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0.9;
  }
  #quoteText{
    font-size:1.7rem;
    line-height:1.45;
    font-style:italic;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.25s, transform 0.25s;
    text-shadow:0 0 30px rgba(110,231,255,0.1);
  }
  #quoteText.fade{ opacity:0; transform:translateY(6px); }
  #quoteAuthor{
    margin-top:18px;
    font-size:1rem;
    color:var(--muted);
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-style:normal;
  }
  #quoteAuthor::before{ content:"— "; }

  .controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:40px;
    flex-wrap:wrap;
  }
  button{
    font-family:"Helvetica Neue", Arial, sans-serif;
    font-size:0.85rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:999px;
    padding:12px 24px;
    border:1px solid var(--line);
    background:rgba(15,23,55,0.5);
    color:var(--ink);
    transition:0.15s;
    backdrop-filter:blur(6px);
  }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button:active{ transform:scale(0.96); }
  button.primary{
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    border-color:transparent;
    color:#050a1f;
    font-weight:700;
  }
  button.primary:hover{ filter:brightness(1.1); color:#050a1f; }
  button:disabled{ opacity:0.5; cursor:default; }

  .status{
    margin-top:16px;
    font-size:0.78rem;
    color:var(--muted);
    font-family:"Helvetica Neue", Arial, sans-serif;
    min-height:16px;
  }

  hr{
    border:none;
    border-top:1px solid var(--line);
    width:60px;
    margin:0 auto 28px;
  }
  .credit{
    margin-top:32px;
    font-size:0.72rem;
    letter-spacing:0.04em;
    color:var(--muted);
    font-family:"Helvetica Neue", Arial, sans-serif;
  }
  .credit span{ color:var(--accent); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="stage">
  <div class="mark">“</div>
  <blockquote id="quoteText" style="margin:0;">Loading a quote…</blockquote>
  <hr>
  <cite id="quoteAuthor"></cite>

  <div class="controls">
    <button class="primary" id="newQuoteBtn">New quote</button>
    <button id="copyBtn">Copy</button>
    <button id="tweetBtn">Share on X</button>
  </div>
  <div class="status" id="statusMsg"></div>
  <div class="credit">Built by <span>BNMPC IT Club</span></div>
</div>

<script>
  // Starfield background
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 6000);
    for(let i = 0; i < STAR_COUNT; i++){
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.06,
        driftY: Math.random() * 0.08 + 0.02
      });
    }

    function tick(){
      ctx.clearRect(0, 0, w, h);
      for(const s of stars){
        s.phase += s.twinkleSpeed;
        s.x += s.driftX;
        s.y += s.driftY;
        if(s.y > h) { s.y = -2; s.x = Math.random() * w; }
        if(s.x > w) s.x = 0;
        if(s.x < 0) s.x = w;

        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,225,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  const quoteText = document.getElementById('quoteText');
  const quoteAuthor = document.getElementById('quoteAuthor');
  const newQuoteBtn = document.getElementById('newQuoteBtn');
  const copyBtn = document.getElementById('copyBtn');
  const tweetBtn = document.getElementById('tweetBtn');
  const statusMsg = document.getElementById('statusMsg');

  const FALLBACK_QUOTES = [
    { content: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { content: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
    { content: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { content: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },
    { content: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci" }
  ];

  let current = null;
  let loading = false;

  async function fetchQuote(){
    if(loading) return;
    loading = true;
    newQuoteBtn.disabled = true;
    statusMsg.textContent = '';
    quoteText.classList.add('fade');

    await new Promise(r => setTimeout(r, 200));

    try{
      const res = await fetch('https://api.quotable.io/random');
      if(!res.ok) throw new Error('API error ' + res.status);
      const data = await res.json();
      current = { content: data.content, author: data.author || 'Unknown' };
    }catch(err){
      const pick = FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)];
      current = pick;
      statusMsg.textContent = 'Live API unavailable right now — showing an offline quote.';
    }

    quoteText.textContent = current.content;
    quoteAuthor.textContent = current.author;
    quoteText.classList.remove('fade');
    newQuoteBtn.disabled = false;
    loading = false;
  }

  copyBtn.addEventListener('click', async () => {
    if(!current) return;
    const text = `"${current.content}" — ${current.author}`;
    try{
      await navigator.clipboard.writeText(text);
      statusMsg.textContent = 'Copied to clipboard.';
    }catch(e){
      statusMsg.textContent = 'Could not copy automatically — select the text manually.';
    }
  });

  tweetBtn.addEventListener('click', () => {
    if(!current) return;
    const text = encodeURIComponent(`"${current.content}" — ${current.author}`);
    window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
  });

  newQuoteBtn.addEventListener('click', fetchQuote);

  fetchQuote();
</script>
</body>
</html>
