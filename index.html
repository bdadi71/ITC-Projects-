<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITC Projects</title>
<style>
  :root{
    --bg-deep:#050a1f;
    --bg-mid:#0c1638;
    --panel:rgba(15,23,55,0.65);
    --line:#2a355f;
    --ink:#eef2ff;
    --muted:#7c86ad;
    --accent:#6ee7ff;
    --accent2:#8b7bff;
    font-family:"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, var(--bg-mid), var(--bg-deep) 70%);
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    position:relative;
    overflow-x:hidden;
  }
  canvas#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .wrap{
    width:100%;
    max-width:480px;
    position:relative;
    z-index:1;
    text-align:center;
    animation:riseIn 0.6s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  h1{
    font-size:1.8rem;
    margin:0 0 6px;
    font-weight:700;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:0.9rem;
    margin:0 0 32px;
  }
  .grid{
    display:grid;
    gap:14px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    text-decoration:none;
    color:var(--ink);
    backdrop-filter:blur(10px);
    transition:border-color 0.15s, transform 0.15s;
    text-align:left;
  }
  a.card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
  }
  a.card .emoji{ font-size:1.6rem; flex:0 0 auto; }
  a.card .title{ font-weight:600; font-size:1.02rem; }
  a.card .desc{ font-size:0.8rem; color:var(--muted); margin-top:2px; }

  .credit{
    margin-top:36px;
    font-size:0.75rem;
    letter-spacing:0.04em;
    color:var(--muted);
    font-family:monospace;
  }
  .credit span{ color:var(--accent); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <h1>ITC Projects</h1>
  <p class="sub">Four small web apps — pick one to open.</p>

  <div class="grid">
    <a class="card" href="todo-list.html">
      <span class="emoji">📝</span>
      <span>
        <div class="title">To-Do List</div>
        <div class="desc">Add, complete, and filter tasks</div>
      </span>
    </a>
    <a class="card" href="password-generator.html">
      <span class="emoji">🔐</span>
      <span>
        <div class="title">Password Generator</div>
        <div class="desc">Strong, random passwords with strength meter</div>
      </span>
    </a>
    <a class="card" href="quote-generator.html">
      <span class="emoji">💬</span>
      <span>
        <div class="title">Random Quote Generator</div>
        <div class="desc">Fetches a fresh quote from an API</div>
      </span>
    </a>
    <a class="card" href="grid-calculator.html">
      <span class="emoji">🧮</span>
      <span>
        <div class="title">Grid Calculator</div>
        <div class="desc">Simple arithmetic calculator</div>
      </span>
    </a>
  </div>

  <div class="credit">Built by <span>BNMPC IT Club</span></div>
</div>

<script>
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];
    function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 6000);
    for(let i = 0; i < STAR_COUNT; i++){
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.06,
        driftY: Math.random() * 0.08 + 0.02
      });
    }
    function tick(){
      ctx.clearRect(0, 0, w, h);
      for(const s of stars){
        s.phase += s.twinkleSpeed;
        s.x += s.driftX; s.y += s.driftY;
        if(s.y > h){ s.y = -2; s.x = Math.random() * w; }
        if(s.x > w) s.x = 0;
        if(s.x < 0) s.x = w;
        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,225,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
</body>
</html>
