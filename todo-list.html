<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasklist</title>
<style>
  :root{
    --ink:#eef2ff;
    --bg-deep:#050a1f;
    --bg-mid:#0c1638;
    --panel:rgba(15,23,55,0.65);
    --line:#26305e;
    --accent:#6ee7ff;
    --accent2:#8b7bff;
    --done:#7280b0;
    --danger:#ff6b6b;
    font-family:"Inter","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, var(--bg-mid), var(--bg-deep) 70%);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 20px;
    position:relative;
    overflow-x:hidden;
  }
  canvas#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .board{
    width:100%;
    max-width:560px;
    position:relative;
    z-index:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 60px rgba(110,231,255,0.06), 0 20px 50px rgba(0,0,0,0.4);
    animation:riseIn 0.5s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:24px;
  }
  h1{
    font-size:1.6rem;
    letter-spacing:0.01em;
    margin:0;
    font-weight:600;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .date{
    font-family:"Courier New", monospace;
    font-size:0.78rem;
    color:var(--done);
  }
  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:26px;
  }
  input[type=text]{
    flex:1;
    padding:13px 14px;
    border:1px solid var(--line);
    background:rgba(5,10,30,0.6);
    color:var(--ink);
    font-family:inherit;
    font-size:1rem;
    border-radius:10px;
    transition:border-color 0.2s, box-shadow 0.2s;
  }
  input[type=text]::placeholder{ color:var(--done); }
  input[type=text]:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(110,231,255,0.15);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .add-row button{
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#050a1f;
    font-weight:700;
    padding:0 22px;
    font-size:1rem;
    border-radius:10px;
    transition:transform 0.12s, filter 0.15s;
  }
  .add-row button:hover{ filter:brightness(1.1); }
  .add-row button:active{ transform:scale(0.96); }

  .filters{
    display:flex;
    gap:4px;
    margin-bottom:18px;
    font-family:"Courier New", monospace;
    font-size:0.76rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .filters button{
    background:none;
    padding:6px 12px;
    color:var(--done);
    border-bottom:2px solid transparent;
    transition:color 0.15s, border-color 0.15s;
  }
  .filters button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  ul{ list-style:none; margin:0; padding:0; }
  li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    animation:appear 0.3s ease both;
  }
  @keyframes appear{
    from{ opacity:0; transform:translateX(-8px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .check{
    width:21px;
    height:21px;
    border:1.5px solid var(--accent);
    border-radius:50%;
    flex:0 0 auto;
    cursor:pointer;
    position:relative;
    background:transparent;
    transition:background 0.2s, box-shadow 0.2s;
  }
  li.done .check{
    background:var(--accent);
    box-shadow:0 0 12px rgba(110,231,255,0.6);
  }
  li.done .check::after{
    content:"";
    position:absolute;
    left:6px; top:3px;
    width:5px; height:9px;
    border:solid #050a1f;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .text{
    flex:1;
    font-size:1.02rem;
    word-break:break-word;
    transition:color 0.2s;
  }
  li.done .text{
    color:var(--done);
    text-decoration:line-through;
  }
  .remove{
    background:none;
    color:var(--done);
    font-size:1.1rem;
    padding:4px 6px;
    opacity:0;
    transition:opacity 0.15s, color 0.15s, transform 0.15s;
  }
  li:hover .remove{ opacity:1; }
  .remove:hover{ color:var(--danger); transform:scale(1.15); }

  .empty{
    text-align:center;
    padding:40px 0;
    color:var(--done);
    font-style:italic;
  }
  footer{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    font-family:"Courier New", monospace;
    font-size:0.76rem;
    color:var(--done);
  }
  footer button{
    background:none;
    color:var(--accent2);
    text-decoration:underline;
  }
  .credit{
    text-align:center;
    margin-top:22px;
    font-size:0.72rem;
    letter-spacing:0.04em;
    color:var(--done);
    font-family:"Courier New", monospace;
  }
  .credit span{ color:var(--accent); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="board">
  <header>
    <h1>Today's List</h1>
    <span class="date" id="dateLabel"></span>
  </header>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="What needs doing?" maxlength="140" autofocus>
    <button id="addBtn">Add</button>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Done</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="emptyMsg" style="display:none;">Nothing here yet. Add your first task above.</div>

  <footer>
    <span id="countLabel">0 tasks</span>
    <button id="clearDone">Clear completed</button>
  </footer>
  <div class="credit">Built by <span>BNMPC IT Club</span></div>
</div>

<script>
  // Starfield background
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 6000);
    for(let i = 0; i < STAR_COUNT; i++){
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.06,
        driftY: Math.random() * 0.08 + 0.02
      });
    }

    function tick(){
      ctx.clearRect(0, 0, w, h);
      for(const s of stars){
        s.phase += s.twinkleSpeed;
        s.x += s.driftX;
        s.y += s.driftY;
        if(s.y > h) { s.y = -2; s.x = Math.random() * w; }
        if(s.x > w) s.x = 0;
        if(s.x < 0) s.x = w;

        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,225,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  const STORAGE_KEY = 'tasklist.items';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const emptyMsg = document.getElementById('emptyMsg');
  const countLabel = document.getElementById('countLabel');
  const clearDoneBtn = document.getElementById('clearDone');
  const filterBtns = document.querySelectorAll('.filters button');

  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString(undefined, {
    weekday:'short', month:'short', day:'numeric'
  });

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function addTask(text){
    text = text.trim();
    if(!text) return;
    tasks.unshift({ id: Date.now() + Math.random(), text, done:false });
    save();
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t) t.done = !t.done;
    save();
    render();
  }

  function removeTask(id){
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function render(){
    let visible = tasks;
    if(filter === 'active') visible = tasks.filter(t => !t.done);
    if(filter === 'done') visible = tasks.filter(t => t.done);

    listEl.innerHTML = '';
    visible.forEach(t => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.innerHTML = `
        <span class="check" data-id="${t.id}"></span>
        <span class="text">${escapeHtml(t.text)}</span>
        <button class="remove" data-id="${t.id}">&times;</button>
      `;
      listEl.appendChild(li);
    });

    emptyMsg.style.display = visible.length ? 'none' : 'block';
    const remaining = tasks.filter(t => !t.done).length;
    countLabel.textContent = `${remaining} of ${tasks.length} remaining`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  addBtn.addEventListener('click', () => {
    addTask(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      addTask(inputEl.value);
      inputEl.value = '';
    }
  });

  listEl.addEventListener('click', e => {
    const id = e.target.dataset.id;
    if(!id) return;
    const numId = Number(id) === +id ? parseFloat(id) : id;
    if(e.target.classList.contains('check')) toggleTask(numId);
    if(e.target.classList.contains('remove')) removeTask(numId);
  });

  clearDoneBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
