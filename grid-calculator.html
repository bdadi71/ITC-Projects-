<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Calculator</title>
<style>
  :root{
    --bg-deep:#050a1f;
    --bg-mid:#0c1638;
    --panel:rgba(15,23,55,0.65);
    --display-bg:rgba(5,10,30,0.75);
    --key:rgba(30,40,80,0.6);
    --key-hover:rgba(45,58,105,0.8);
    --op:#3d5a9e;
    --op-hover:#4d6db8;
    --accent:#6ee7ff;
    --accent2:#8b7bff;
    --text:#eef2ff;
    --muted:#7c86ad;
    font-family:"Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, var(--bg-mid), var(--bg-deep) 70%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }
  canvas#stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .calc{
    width:100%;
    max-width:340px;
    background:var(--panel);
    border:1px solid #2a355f;
    border-radius:22px;
    padding:20px;
    position:relative;
    z-index:1;
    backdrop-filter:blur(10px);
    box-shadow:0 0 60px rgba(110,231,255,0.06), 0 20px 50px rgba(0,0,0,0.4);
    animation:riseIn 0.5s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(16px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .display{
    background:var(--display-bg);
    border-radius:14px;
    padding:22px 18px 18px;
    margin-bottom:16px;
    text-align:right;
    overflow:hidden;
    border:1px solid #1c274e;
  }
  .history{
    min-height:20px;
    font-size:0.85rem;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:opacity 0.2s;
  }
  .current{
    font-size:2.4rem;
    color:var(--text);
    font-weight:300;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-height:44px;
    transition:opacity 0.15s, transform 0.15s;
  }
  .current.pop{ animation:pop 0.18s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }
  button{
    font-family:inherit;
    font-size:1.15rem;
    padding:18px 0;
    border:none;
    border-radius:14px;
    background:var(--key);
    color:var(--text);
    cursor:pointer;
    transition:background 0.12s, transform 0.06s, box-shadow 0.15s;
  }
  button:active{ transform:scale(0.94); }
  button:hover{ background:var(--key-hover); }

  button.op{ background:linear-gradient(135deg, var(--op), #2c3f78); }
  button.op:hover{ background:linear-gradient(135deg, var(--op-hover), #37509c); }

  button.equals{
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#050a1f;
    font-weight:700;
    grid-row:span 2;
  }
  button.equals:hover{ filter:brightness(1.1); }
  button.equals:active{ box-shadow:0 0 24px rgba(110,231,255,0.5); }

  button.wide{ grid-column:span 2; }
  button.func{ color:var(--muted); font-size:1rem; }

  @media (max-width:360px){
    .current{ font-size:2rem; }
  }
  .credit{
    text-align:center;
    margin-top:16px;
    font-size:0.68rem;
    letter-spacing:0.04em;
    color:var(--muted);
    font-family:monospace;
  }
  .credit span{ color:var(--accent); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="calc">
  <div class="display">
    <div class="history" id="history">&nbsp;</div>
    <div class="current" id="current">0</div>
  </div>

  <div class="grid">
    <button class="func" data-action="clear">AC</button>
    <button class="func" data-action="negate">±</button>
    <button class="func" data-action="percent">%</button>
    <button class="op" data-action="operator" data-value="÷">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-action="operator" data-value="×">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-action="operator" data-value="−">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-action="operator" data-value="+">+</button>

    <button class="wide" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
  <div class="credit">Built by <span>BNMPC IT Club</span></div>
</div>

<script>
  // Starfield background
  (function(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, stars = [];

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 6000);
    for(let i = 0; i < STAR_COUNT; i++){
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.3,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        phase: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.06,
        driftY: Math.random() * 0.08 + 0.02
      });
    }

    function tick(){
      ctx.clearRect(0, 0, w, h);
      for(const s of stars){
        s.phase += s.twinkleSpeed;
        s.x += s.driftX;
        s.y += s.driftY;
        if(s.y > h) { s.y = -2; s.x = Math.random() * w; }
        if(s.x > w) s.x = 0;
        if(s.x < 0) s.x = w;

        const alpha = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,225,255,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');

  let currentValue = '0';
  let previousValue = null;
  let pendingOperator = null;
  let overwrite = true;

  function updateDisplay(){
    currentEl.textContent = formatNumber(currentValue);
    historyEl.textContent = previousValue !== null
      ? `${formatNumber(previousValue)} ${pendingOperator}`
      : '\u00A0';
    currentEl.classList.remove('pop');
    void currentEl.offsetWidth;
    currentEl.classList.add('pop');
  }

  function formatNumber(numStr){
    if(numStr === 'Error') return numStr;
    const [intPart, decPart] = numStr.toString().split('.');
    const formattedInt = new Intl.NumberFormat('en-US').format(intPart);
    return decPart !== undefined ? `${formattedInt}.${decPart}` : formattedInt;
  }

  function inputDigit(digit){
    if(currentValue === 'Error'){
      currentValue = '0';
      overwrite = true;
    }
    if(overwrite){
      currentValue = digit;
      overwrite = false;
    }else{
      if(currentValue.replace('-','').replace('.','').length >= 15) return;
      currentValue = currentValue === '0' ? digit : currentValue + digit;
    }
    updateDisplay();
  }

  function inputDecimal(){
    if(currentValue === 'Error'){
      currentValue = '0';
      overwrite = false;
    }
    if(overwrite){
      currentValue = '0.';
      overwrite = false;
    }else if(!currentValue.includes('.')){
      currentValue += '.';
    }
    updateDisplay();
  }

  function setOperator(op){
    if(currentValue === 'Error') return;
    if(pendingOperator && !overwrite){
      compute();
    }
    previousValue = currentValue;
    pendingOperator = op;
    overwrite = true;
    updateDisplay();
  }

  function compute(){
    if(pendingOperator === null || previousValue === null) return;
    const a = parseFloat(previousValue);
    const b = parseFloat(currentValue);
    let result;

    switch(pendingOperator){
      case '+': result = a + b; break;
      case '−': result = a - b; break;
      case '×': result = a * b; break;
      case '÷':
        if(b === 0){
          currentValue = 'Error';
          previousValue = null;
          pendingOperator = null;
          overwrite = true;
          updateDisplay();
          return;
        }
        result = a / b;
        break;
      default: return;
    }

    result = Math.round((result + Number.EPSILON) * 1e10) / 1e10;

    currentValue = result.toString();
    previousValue = null;
    pendingOperator = null;
    overwrite = true;
    updateDisplay();
  }

  function clearAll(){
    currentValue = '0';
    previousValue = null;
    pendingOperator = null;
    overwrite = true;
    updateDisplay();
  }

  function negate(){
    if(currentValue === 'Error' || currentValue === '0') return;
    currentValue = currentValue.startsWith('-') ? currentValue.slice(1) : '-' + currentValue;
    updateDisplay();
  }

  function percent(){
    if(currentValue === 'Error') return;
    currentValue = (parseFloat(currentValue) / 100).toString();
    updateDisplay();
  }

  document.querySelector('.grid').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;

    if(btn.dataset.num !== undefined){
      inputDigit(btn.dataset.num);
      return;
    }

    switch(btn.dataset.action){
      case 'clear': clearAll(); break;
      case 'negate': negate(); break;
      case 'percent': percent(); break;
      case 'decimal': inputDecimal(); break;
      case 'operator': setOperator(btn.dataset.value); break;
      case 'equals': compute(); break;
    }
  });

  window.addEventListener('keydown', e => {
    if(e.key >= '0' && e.key <= '9'){ inputDigit(e.key); return; }
    if(e.key === '.'){ inputDecimal(); return; }
    if(e.key === '+'){ setOperator('+'); return; }
    if(e.key === '-'){ setOperator('−'); return; }
    if(e.key === '*'){ setOperator('×'); return; }
    if(e.key === '/'){ e.preventDefault(); setOperator('÷'); return; }
    if(e.key === 'Enter' || e.key === '='){ compute(); return; }
    if(e.key === 'Escape'){ clearAll(); return; }
    if(e.key === 'Backspace'){
      if(currentValue === 'Error'){ clearAll(); return; }
      currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : '0';
      updateDisplay();
    }
  });

  updateDisplay();
</script>
</body>
</html>
